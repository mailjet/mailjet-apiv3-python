name: mailjet-dev
channels:
  - defaults
dependencies:
  # conda in defaults does not support Python 3.15 yet
  - python >=3.10,<3.15
  # build & host deps
  - pip
  - setuptools-scm
  # PyPI publishing only (modern PEP 517 package builder)
  - python-build
  # runtime deps
  - httpx2 >=2.0.0
  - requests >=2.33.0
  - typing-extensions >=4.7.1
  # tests
  - coverage >=7.16.2
  - hypothesis
  - pyfakefs
  - pytest >=9.0.3
  - pytest-benchmark >=5.3.0
  - pytest-cov
  - pytest-xdist
  - responses
  # linters, formatters & typing (Aligned with pre-commit-config.yaml)
  - mypy
  - ruff
  - types-requests
  # other
  - conda
  - conda-build
  - jsonschema
  - pre-commit
  - python-dotenv >=1.2.2
  - types-jsonschema
  - pip:
      # Optional: requires Clang/libFuzzer; install via: pip install -e ".[fuzzing]"
      # - atheris
      - bandit
      - orjson >=3.10.0
      - pip-audit
      - pyright
      - scalene >=2.4.0
      - slotscheck
      - snakeviz
      - typos
      - vulture
      # PyPI publishing only
      - twine
