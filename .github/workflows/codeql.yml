name: CodeQL
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule: [{ cron: "37 3 * * 0" }]   # weekly full scan

jobs:
  analyze:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # 4.37.7
        with:
          languages: python
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3  # 4.37.6
        with:
          category: "/language:python"
