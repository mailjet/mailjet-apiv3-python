name: Publish Package

on:
  push:
    tags: ['v*']  # Triggers on any tag push
  release:
    types: [published]  # Triggers when a GitHub release is published
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify Distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      is_stable: ${{ steps.get_version.outputs.is_stable }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install build tools
        run: pip install --upgrade build setuptools setuptools-scm twine

      - name: Extract version
        id: get_version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "release" ]]; then
            TAG_NAME="$RELEASE_TAG"
          else
            TAG_NAME="$REF_NAME"
          fi

          VERSION="${TAG_NAME#v}"

          if [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IS_STABLE="true"
          else
            IS_STABLE="false"
          fi

          echo "is_stable=$IS_STABLE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build package
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.get_version.outputs.version }}
        run: python -m build

      - name: Verify package (check dist)
        run: |
          ls -alh dist
          twine check dist/*

      - name: Verify wheel contents
        run: |
          set -o pipefail
          wheel_listing="$(unzip -l dist/*.whl)"
          for required_file in \
            "mailjet_rest/py.typed" \
            "mailjet_rest/client.pyi" \
            "mailjet_rest/endpoint.pyi" \
            "mailjet_rest/errors.py" \
            "mailjet_rest/testing.py" \
            "mailjet_rest/webhooks.py" \
            "mailjet_rest/utils/retry.py" \
            "mailjet_rest/utils/routing.py" \
            "mailjet_rest/utils/telemetry.py" \
            "mailjet_rest/utils/html_guard.py" \
            "mailjet_rest/utils/filesystem_security.py" \
            "mailjet_rest/utils/transport_security.py"
          do
            echo "$wheel_listing" | grep -q "$required_file" || {
              echo "Missing expected file in wheel: $required_file" >&2
              exit 1
            }
          done

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-artifacts
          path: dist/*
          if-no-files-found: error
          retention-days: 5

      - name: Generate CycloneDX 1.5 SBOM
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          mkdir -p sbom
          python -m venv .sbom-tool-venv
          python -m venv .sbom-target-venv
          .sbom-tool-venv/bin/pip install --no-cache-dir cyclonedx-bom
          .sbom-target-venv/bin/pip install --no-cache-dir dist/*.whl
          .sbom-tool-venv/bin/cyclonedx-py environment .sbom-target-venv/bin/python \
            --pyproject pyproject.toml \
            --mc-type library \
            --sv 1.5 \
            --of JSON \
            --output-reproducible \
            -o "sbom/mailjet-rest-${VERSION}.cdx.json"
          rm -rf .sbom-tool-venv .sbom-target-venv

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-artifacts
          path: sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release' && !github.event.release.prerelease && needs.build.outputs.is_stable == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mailjet-rest
    permissions:
      id-token: write  # Required for OIDC trusted publishing
      attestations: write  # Required for PEP 740 attestations
      contents: write  # Required to attach CycloneDX SBOM to GitHub Release

    steps:
      - name: Download verified distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-artifacts
          path: dist

      - name: Download SBOM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-artifacts
          path: sbom

      - name: Publish to PyPI via OIDC Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
        with:
          attestations: true
          verbose: true

      - name: Generate SLSA v1.2 build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*
            sbom/*.cdx.json

      - name: Attach SBOM to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" sbom/*.cdx.json --clobber
