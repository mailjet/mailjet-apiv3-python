name: Continuous Security Verification

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '37 3 * * 0'  # weekly full scan

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: 'pip'
      - run: python -m pip install --upgrade pip
      - run: pip install . ruff bandit mypy types-requests slotscheck
      - run: ruff check .
      - run: bandit -c pyproject.toml -r mailjet_rest
      - run: mypy --strict mailjet_rest
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"
      - run: slotscheck -m mailjet_rest

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13" }
      - name: Install package + extras in isolated target venv and audit
        run: |
          python -m pip install --upgrade pip
          python -m venv .audit-venv
          .audit-venv/bin/pip install --no-cache-dir ".[async,speedups,tests,linting]"
          .audit-venv/bin/pip uninstall -y mailjet-rest
          pip install --no-cache-dir pip-audit
          PIPAPI_PYTHON_LOCATION="$PWD/.audit-venv/bin/python" pip-audit --strict --skip-editable
          rm -rf .audit-venv

  osv-scan:
    name: osv-scanner
    runs-on: ubuntu-latest
    permissions:
      actions: read
      security-events: write  # For Security Tab
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run OSV-Scanner
        # zizmor: ignore[unpinned-uses]
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36
        with:
          scan-args: |-
            --format=sarif
            --output=osv-results.sarif
            --allow-no-lockfiles
            --recursive
            ./

      - name: Upload OSV-Scanner SARIF to GitHub Security
        if: >-
          !cancelled() &&
          hashFiles('osv-results.sarif') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # 4.39.3
        with:
          sarif_file: osv-results.sarif
          category: ".github/workflows/security.yml:osv-scan"

  semgrep:
    runs-on: ubuntu-latest
    container:
      # Official Semgrep Docker image
      image: semgrep/semgrep@sha256:bdf7013b2c3634a487671158da77c554f531742326b543a9464d2adf6c433ac8
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run Semgrep CE scan
        run: >-
          semgrep scan
          --config "p/python"
          --config "p/owasp-top-ten"
          --config "p/supply-chain"
          --config "p/command-injection"
          --config "p/insecure-transport"
          --error
